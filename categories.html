
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title> الأقسام</title>
<link rel="stylesheet" href="theme.css">
    <style>


:root {
    --bg-main: #070b14;
    --bg-secondary: #0b1220;
    --bg-card: #0f192b;
    --bg-card-2: #111e33;

    --navy: #0a1324;
    --navy-light: #14233b;

    --blue: #2188ff;
    --blue-light: #4da3ff;
    --blue-dark: #1264c7;

    --white: #ffffff;
    --text: #eaf2ff;
    --text-soft: #a9b8ce;

    --border: rgba(92, 146, 214, .18);
    --border-blue: rgba(33, 136, 255, .35);

    --success: #22c55e;
    --danger: #ef4444;

    --shadow:
        0 15px 45px rgba(0, 0, 0, .35);

    --blue-glow:
        0 0 25px rgba(33, 136, 255, .18);

    --radius: 18px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================================
   BODY
   ========================================================= */

body {
    font-family: Arial, Tahoma, sans-serif;

    min-height: 100vh;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(33, 136, 255, .10),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(30, 64, 175, .10),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #050811 0%,
            #09111f 45%,
            #060b14 100%
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    padding: 18px 28px;

    background:
        linear-gradient(
            135deg,
            rgba(8, 16, 31, .97),
            rgba(12, 25, 46, .97)
        );

    border-bottom: 1px solid var(--border-blue);

    box-shadow:
        0 8px 35px rgba(0, 0, 0, .35),
        0 0 25px rgba(33, 136, 255, .06);

    backdrop-filter: blur(14px);

    animation: headerDown .6s ease both;
}


.logo {
    color: var(--blue-light);

    font-size: 24px;

    font-weight: bold;

    letter-spacing: .5px;

    text-shadow:
        0 0 15px rgba(33, 136, 255, .45);
}


.page-title {
    color: #eaf2ff;

    font-size: 18px;

    font-weight: bold;
}


/* =========================================================
   MAIN
   ========================================================= */

main {
    width: 100%;

    max-width: 1400px;

    margin: auto;

    padding: 32px 25px 50px;

    animation: pageFade .7s ease both;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.top-bar {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

    flex-wrap: wrap;
}


.heading h1 {
    color: var(--white);

    font-size: 30px;

    margin-bottom: 8px;

    text-shadow:
        0 3px 20px rgba(33, 136, 255, .12);
}


.heading p {
    color: var(--text-soft);

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================================
   STAT CARDS
   ========================================================= */

.stats {
    display: flex;

    gap: 14px;

    flex-wrap: wrap;
}


.stat {
    position: relative;

    min-width: 155px;

    padding: 16px 20px;

    background:
        linear-gradient(
            145deg,
            rgba(18, 34, 58, .95),
            rgba(10, 20, 36, .95)
        );

    border: 1px solid var(--border);

    border-radius: 15px;

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}


.stat::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 4px;

    height: 100%;

    background:
        linear-gradient(
            180deg,
            var(--blue-light),
            var(--blue-dark)
        );

    box-shadow:
        0 0 18px rgba(33, 136, 255, .7);
}


.stat:hover {
    transform: translateY(-4px);

    border-color: var(--border-blue);

    box-shadow:
        var(--shadow),
        var(--blue-glow);
}


.stat span {
    display: block;

    color: var(--text-soft);

    font-size: 13px;

    margin-bottom: 7px;
}


.stat strong {
    display: block;

    color: var(--white);

    font-size: 23px;

    text-shadow:
        0 0 12px rgba(77, 163, 255, .25);
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message {
    display: none;

    padding: 14px 17px;

    margin-bottom: 18px;

    border-radius: 12px;

    font-size: 14px;

    border: 1px solid transparent;

    animation: messageIn .35s ease both;
}


.message.success {
    display: block;

    background:
        rgba(34, 197, 94, .09);

    color: #86efac;

    border-color:
        rgba(34, 197, 94, .25);

    box-shadow:
        0 0 20px rgba(34, 197, 94, .06);
}


.message.error {
    display: block;

    background:
        rgba(239, 68, 68, .09);

    color: #fca5a5;

    border-color:
        rgba(239, 68, 68, .25);

    box-shadow:
        0 0 20px rgba(239, 68, 68, .06);
}


/* =========================================================
   LAYOUT
   ========================================================= */

.layout {
    display: grid;

    grid-template-columns: 350px 1fr;

    gap: 22px;

    align-items: start;
}


/* =========================================================
   BOXES
   ========================================================= */

.box {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(15, 27, 47, .96),
            rgba(8, 17, 31, .96)
        );

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 24px;

    box-shadow: var(--shadow);

    backdrop-filter: blur(10px);

    overflow: hidden;

    animation: cardUp .65s ease both;
}


.box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(77, 163, 255, .5),
            transparent
        );

    opacity: .7;
}


.box h2 {
    color: var(--white);

    font-size: 20px;

    margin-bottom: 20px;

    padding-bottom: 14px;

    border-bottom: 1px solid var(--border);
}


/* =========================================================
   LABELS
   ========================================================= */

label {
    display: block;

    color: #dce8f8;

    margin-bottom: 8px;

    font-weight: bold;

    font-size: 14px;
}


/* =========================================================
   INPUTS
   ========================================================= */

input,
textarea {
    width: 100%;

    padding: 13px 14px;

    margin-bottom: 15px;

    color: var(--white);

    background:
        rgba(4, 10, 19, .75);

    border: 1px solid #263b58;

    border-radius: 11px;

    font-size: 15px;

    outline: none;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        transform .25s ease;

    font-family: inherit;
}


input::placeholder,
textarea::placeholder {
    color: #64758d;
}


input:hover,
textarea:hover {
    border-color: #355477;
}


input:focus,
textarea:focus {
    background: #081222;

    border-color: var(--blue);

    box-shadow:
        0 0 0 3px rgba(33, 136, 255, .10),
        0 0 20px rgba(33, 136, 255, .08);

    transform: translateY(-1px);
}


textarea {
    min-height: 100px;

    resize: vertical;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {
    border: 0;

    border-radius: 10px;

    padding: 11px 16px;

    cursor: pointer;

    font-weight: bold;

    font-family: inherit;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        border-color .25s ease;

    position: relative;

    overflow: hidden;
}


button::after {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .5s ease;
}


button:hover::after {
    left: 140%;
}


button:hover {
    transform: translateY(-2px);
}


button:active {
    transform: translateY(0);
}


/* =========================================================
   PRIMARY BUTTON
   ========================================================= */

.primary-btn {
    width: 100%;

    padding: 14px;

    color: white;

    font-size: 16px;

    background:
        linear-gradient(
            135deg,
            #1475dc,
            #0d55a8
        );

    border: 1px solid rgba(77, 163, 255, .35);

    box-shadow:
        0 8px 22px rgba(13, 71, 161, .28),
        0 0 20px rgba(33, 136, 255, .08);
}


.primary-btn:hover {
    background:
        linear-gradient(
            135deg,
            #258fff,
            #1267c7
        );

    box-shadow:
        0 10px 28px rgba(13, 71, 161, .38),
        0 0 25px rgba(33, 136, 255, .18);
}


/* =========================================================
   SECONDARY BUTTON
   ========================================================= */

.secondary-btn {
    color: #dce9fa;

    background:
        #111d30;

    border: 1px solid #2a405e;
}


.secondary-btn:hover {
    background: #172944;

    border-color: #3b6594;

    box-shadow:
        0 0 18px rgba(33, 136, 255, .08);
}


/* =========================================================
   EDIT BUTTON
   ========================================================= */

.edit-btn {
    color: white;

    background:
        linear-gradient(
            135deg,
            #173c67,
            #102b4b
        );

    border: 1px solid rgba(77, 163, 255, .25);
}


.edit-btn:hover {
    background:
        linear-gradient(
            135deg,
            #205488,
            #163b63
        );

    box-shadow:
        0 0 18px rgba(33, 136, 255, .15);
}


/* =========================================================
   DELETE BUTTON
   ========================================================= */

.danger-btn {
    color: white;

    background:
        linear-gradient(
            135deg,
            #b91c1c,
            #7f1d1d
        );

    border: 1px solid rgba(239, 68, 68, .25);
}


.danger-btn:hover {
    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );

    box-shadow:
        0 0 20px rgba(239, 68, 68, .15);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-box {
    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}


.search-box input {
    margin-bottom: 0;
}


/* =========================================================
   CATEGORIES GRID
   ========================================================= */

.categories {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 16px;
}


/* =========================================================
   CATEGORY CARD
   ========================================================= */

.category {
    position: relative;

    padding: 18px;

    background:
        linear-gradient(
            145deg,
            #111f35,
            #0b1526
        );

    border: 1px solid var(--border);

    border-radius: 16px;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease,
        background .3s ease;

    animation: categoryIn .5s ease both;
}


.category::before {
    content: "";

    position: absolute;

    top: 0;
    right: 20px;
    left: 20px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(77, 163, 255, .45),
            transparent
        );

    opacity: .5;
}


.category:hover {
    transform: translateY(-6px);

    background:
        linear-gradient(
            145deg,
            #142640,
            #0d1a2d
        );

    border-color:
        rgba(77, 163, 255, .38);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, .35),
        0 0 25px rgba(33, 136, 255, .10);
}


/* =========================================================
   CATEGORY TOP
   ========================================================= */

.category-top {
    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}


.category h3 {
    color: var(--white);

    font-size: 18px;

    margin-bottom: 6px;
}


/* =========================================================
   CATEGORY ICON
   ========================================================= */

.category-icon {
    width: 50px;

    height: 50px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    flex-shrink: 0;

    background:
        linear-gradient(
            135deg,
            rgba(33, 136, 255, .18),
            rgba(18, 64, 120, .18)
        );

    border: 1px solid
        rgba(77, 163, 255, .20);

    box-shadow:
        0 0 20px rgba(33, 136, 255, .08);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


.category:hover .category-icon {
    transform:
        translateY(-2px)
        rotate(-3deg);

    box-shadow:
        0 0 25px rgba(33, 136, 255, .20);
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.category-description {
    color: var(--text-soft);

    line-height: 1.7;

    font-size: 13px;

    min-height: 42px;

    margin-bottom: 14px;
}


/* =========================================================
   CATEGORY INFO
   ========================================================= */

.category-info {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    border-top: 1px solid var(--border);

    padding-top: 13px;

    margin-top: 8px;
}


.products-count {
    color: #91a4bd;

    font-size: 13px;
}


.products-count strong {
    color: var(--blue-light);

    font-size: 15px;

    text-shadow:
        0 0 10px rgba(77, 163, 255, .25);
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}


.actions button {
    font-size: 12px;

    padding: 8px 10px;
}


/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty,
.loading {
    text-align: center;

    color: #8496ad;

    padding: 55px 20px;

    grid-column: 1 / -1;
}


.loading {
    animation: pulseLoading 1.4s ease-in-out infinite;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(2, 6, 13, .78);

    backdrop-filter: blur(8px);

    z-index: 1000;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.modal.show {
    display: flex;

    animation: modalBackground .25s ease both;
}


/* =========================================================
   MODAL CONTENT
   ========================================================= */

.modal-content {
    width: 100%;

    max-width: 500px;

    background:
        linear-gradient(
            145deg,
            #12213a,
            #091321
        );

    border: 1px solid
        rgba(77, 163, 255, .25);

    border-radius: 20px;

    padding: 26px;

    box-shadow:
        0 25px 80px rgba(0, 0, 0, .55),
        0 0 35px rgba(33, 136, 255, .10);

    animation: modalUp .35s cubic-bezier(.2,.8,.2,1) both;
}


/* =========================================================
   MODAL HEADER
   ========================================================= */

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;

    padding-bottom: 14px;

    border-bottom: 1px solid var(--border);
}


.modal-header h2 {
    color: var(--white);

    margin: 0;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.close-btn {
    width: 36px;

    height: 36px;

    border-radius: 50%;

    padding: 0;

    color: #cbd5e1;

    background: #152238;

    border: 1px solid #29405e;

    font-size: 20px;
}


.close-btn:hover {
    color: white;

    background: #a51d2d;

    border-color: #d33;

    box-shadow:
        0 0 18px rgba(239, 68, 68, .18);
}


/* =========================================================
   MODAL ACTIONS
   ========================================================= */

.modal-actions {
    display: flex;

    gap: 10px;

    margin-top: 5px;
}


.modal-actions button {
    flex: 1;
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {
    width: 9px;
}


::-webkit-scrollbar-track {
    background: #050912;
}


::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            #1d385c,
            #10243e
        );

    border-radius: 20px;

    border: 2px solid #050912;
}


::-webkit-scrollbar-thumb:hover {
    background:
        linear-gradient(
            180deg,
            #2b70b5,
            #174b7e
        );
}


/* =========================================================
   SELECTION
   ========================================================= */

::selection {
    background: rgba(33, 136, 255, .35);

    color: white;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes pageFade {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes headerDown {

    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes cardUp {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes categoryIn {

    from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(-8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes modalBackground {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes modalUp {

    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


@keyframes pulseLoading {

    0%,
    100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {

    .layout {
        grid-template-columns: 1fr;
    }

}


@media (max-width: 600px) {

    header {
        padding: 15px 17px;
    }


    .logo {
        font-size: 20px;
    }


    .page-title {
        font-size: 15px;
    }


    main {
        padding: 22px 15px 40px;
    }


    .top-bar {
        align-items: stretch;
    }


    .heading h1 {
        font-size: 24px;
    }


    .stats {
        width: 100%;
    }


    .stat {
        flex: 1;

        min-width: 120px;
    }


    .layout {
        gap: 16px;
    }


    .box {
        padding: 18px;
    }


    .categories {
        grid-template-columns: 1fr;
    }


    .search-box {
        flex-direction: column;
    }


    .category-info {
        align-items: flex-start;

        flex-direction: column;
    }


    .actions {
        width: 100%;
    }


    .actions button {
        flex: 1;
    }


    .modal-content {
        padding: 20px;

        border-radius: 17px;
    }

}


@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;
    }

}


    </style>

</head>

<body>

<header>

    <div class="logo">
       
    </div>

    <div class="page-title">
        📂 الأقسام
    </div>

</header>


<main>

    <div class="top-bar">

        <div class="heading">

            <h1>📂 إدارة الأقسام</h1>

            <p>
                إضافة وتعديل ومراجعة أقسام المنتجات في المحل
            </p>

        </div>

        <div class="stats">

            <div class="stat">

                <span>إجمالي الأقسام</span>

                <strong id="totalCategories">
                    0
                </strong>

            </div>

            <div class="stat">

                <span>إجمالي المنتجات</span>

                <strong id="totalProducts">
                    0
                </strong>

            </div>

        </div>

    </div>


    <div id="message"
         class="message">
    </div>


    <div class="layout">


        <!-- إضافة قسم -->

        <section class="box">

            <h2>
                ➕ إضافة قسم جديد
            </h2>

            <form id="categoryForm">

                <label>
                    اسم القسم *
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="مثال: المشروبات"
                    required
                >


                <label>
                    الوصف
                </label>

                <textarea
                    id="description"
                    placeholder="وصف مختصر للقسم..."
                ></textarea>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    ➕ إضافة القسم
                </button>

            </form>

        </section>


        <!-- الأقسام -->

        <section class="box">

            <h2>
                📋 قائمة الأقسام
            </h2>

            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    placeholder="🔎 ابحث باسم القسم..."
                    oninput="searchCategories()"
                >

                <button
                    class="secondary-btn"
                    onclick="loadCategories()"
                    type="button"
                >
                    🔄 تحديث
                </button>

            </div>


            <div id="categories"
                 class="categories">

                <div class="loading">
                    جاري تحميل الأقسام...
                </div>

            </div>

        </section>

    </div>

</main>


<!-- تعديل القسم -->

<div id="editModal"
     class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                ✏️ تعديل القسم
            </h2>

            <button
                class="close-btn"
                onclick="closeEditModal()"
                type="button"
            >
                ×
            </button>

        </div>


        <input
            type="hidden"
            id="editId"
        >


        <label>
            اسم القسم *
        </label>

        <input
            type="text"
            id="editName"
            required
        >


        <label>
            الوصف
        </label>

        <textarea
            id="editDescription"
        ></textarea>


        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeEditModal()"
                type="button"
            >
                إلغاء
            </button>

            <button
                class="primary-btn"
                onclick="updateCategory()"
                type="button"
            >
                💾 حفظ التعديل
            </button>

        </div>

    </div>

</div>


<script>

    const API = "http://localhost:3000/api";

    const token =
        localStorage.getItem("token");


    /* =========================
       حماية الصفحة
    ========================= */

    if (!token) {

        window.location.href = "login.html";

    }


    /* =========================
       API Fetch
    ========================= */

    async function apiFetch(url, options = {}) {

        const currentToken =
            localStorage.getItem("token");


        if (!currentToken) {

            window.location.href = "login.html";

            return;

        }


        options.headers = {

            ...(options.headers || {}),

            "Authorization":
                `Bearer ${currentToken}`,

            "Content-Type":
                "application/json"

        };


        const response =
            await fetch(url, options);


        if (response.status === 401) {

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

            return;

        }


        return response;

    }


    /* =========================
       البيانات
    ========================= */

    let categories = [];


    /* =========================
       تحميل الأقسام
    ========================= */

    async function loadCategories() {

        const container =
            document.getElementById("categories");


        container.innerHTML = `
            <div class="loading">
                ⏳ جاري تحميل الأقسام...
            </div>
        `;


        try {

            const response =
                await apiFetch(
                    `${API}/categories`
                );


            if (!response) return;


            const data =
                await response.json();


            /*
             * ندعم أكثر من شكل للـ response
             * حتى لا تتأثر الصفحة بتغيير بسيط
             * في الـ Backend.
             */

            categories =
                data.categories ||
                data.data ||
                data ||
                [];


            if (!Array.isArray(categories)) {

                categories = [];

            }


            renderCategories(categories);

            updateStats();

        }

        catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="empty">
                    ❌ تعذر تحميل الأقسام
                    <br>
                    <small>
                        تأكد أن الـ Backend يعمل
                    </small>
                </div>
            `;

        }

    }


    /* =========================
       عرض الأقسام
    ========================= */

    function renderCategories(list) {

        const container =
            document.getElementById("categories");


        if (!list.length) {

            container.innerHTML = `
                <div class="empty">

                    📂 لا توجد أقسام حتى الآن

                    <br><br>

                    أضف أول قسم من النموذج الموجود بجانبك.

                </div>
            `;

            return;

        }


        container.innerHTML =
            list.map(category => {


                const id =
                    category.id;


                const name =
                    escapeHtml(
                        category.name ||
                        category.category_name ||
                        "بدون اسم"
                    );


                const description =
                    escapeHtml(
                        category.description ||
                        category.notes ||
                        "لا يوجد وصف"
                    );


                const productCount =
                    Number(
                        category.product_count ??
                        category.products_count ??
                        category.productsCount ??
                        0
                    );


                return `

                    <div class="category">

                        <div class="category-top">

                            <div>

                                <h3>
                                    ${name}
                                </h3>

                            </div>

                            <div class="category-icon">
                                📦
                            </div>

                        </div>


                        <div class="category-description">

                            ${description}

                        </div>


                        <div class="category-info">

                            <div class="products-count">

                                المنتجات:

                                <strong>
                                    ${productCount}
                                </strong>

                            </div>


                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="openEditModal('${id}')"
                                >
                                    ✏️ تعديل
                                </button>

                                <button
                                    class="danger-btn"
                                    onclick="deleteCategory('${id}')"
                                >
                                    🗑 حذف
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* =========================
       البحث
    ========================= */

    function searchCategories() {

        const value =
            document.getElementById("search")
            .value
            .trim()
            .toLowerCase();


        const filtered =
            categories.filter(category => {

                const name =
                    (
                        category.name ||
                        category.category_name ||
                        ""
                    ).toLowerCase();


                return name.includes(value);

            });


        renderCategories(filtered);

    }


    /* =========================
       إضافة قسم
    ========================= */

    document
        .getElementById("categoryForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("name")
                    .value
                    .trim();


                const description =
                    document
                    .getElementById("description")
                    .value
                    .trim();


                if (!name) {

                    showMessage(
                        "اكتب اسم القسم أولًا",
                        "error"
                    );

                    return;

                }


                try {

                    const response =
                        await apiFetch(
                            `${API}/categories`,
                            {

                                method: "POST",

                                body: JSON.stringify({

                                    name: name,

                                    description:
                                        description

                                })

                            }
                        );


                    if (!response) return;


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            data.error ||
                            "فشل إضافة القسم"
                        );

                    }


                    showMessage(
                        "✅ تم إضافة القسم بنجاح",
                        "success"
                    );


                    document
                        .getElementById(
                            "categoryForm"
                        )
                        .reset();


                    await loadCategories();

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        error.message ||
                        "❌ حدث خطأ أثناء إضافة القسم",
                        "error"
                    );

                }

            }
        );


    /* =========================
       فتح التعديل
    ========================= */

    function openEditModal(id) {

        const category =
            categories.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!category) {

            showMessage(
                "القسم غير موجود",
                "error"
            );

            return;

        }


        document
            .getElementById("editId")
            .value =
                category.id;


        document
            .getElementById("editName")
            .value =
                category.name ||
                category.category_name ||
                "";


        document
            .getElementById("editDescription")
            .value =
                category.description ||
                category.notes ||
                "";


        document
            .getElementById("editModal")
            .classList.add("show");

    }


    /* =========================
       إغلاق التعديل
    ========================= */

    function closeEditModal() {

        document
            .getElementById("editModal")
            .classList.remove("show");

    }


    /* =========================
       تعديل القسم
    ========================= */

    async function updateCategory() {

        const id =
            document
            .getElementById("editId")
            .value;


        const name =
            document
            .getElementById("editName")
            .value
            .trim();


        const description =
            document
            .getElementById("editDescription")
            .value
            .trim();


        if (!name) {

            showMessage(
                "اسم القسم مطلوب",
                "error"
            );

            return;

        }


        try {

            const response =
                await apiFetch(
                    `${API}/categories/${id}`,
                    {

                        method: "PUT",

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                description:
                                    description

                            })

                    }
                );


            if (!response) return;


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "فشل تعديل القسم"
                );

            }


            closeEditModal();


            showMessage(
                "✅ تم تعديل القسم بنجاح",
                "success"
            );


            await loadCategories();

        }

        catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "❌ حدث خطأ أثناء تعديل القسم",
                "error"
            );

        }

    }


    /* =========================
       حذف القسم
    ========================= */

    async function deleteCategory(id) {

        const category =
            categories.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!category) return;


        const name =
            category.name ||
            category.category_name ||
            "هذا القسم";


        const confirmed =
            confirm(
                `هل أنت متأكد من حذف قسم "${name}"؟\n\n` +
                `يفضل حذف القسم فقط إذا لم تعد المنتجات مرتبطة به.`
            );


        if (!confirmed) return;


        try {

            const response =
                await apiFetch(
                    `${API}/categories/${id}`,
                    {

                        method: "DELETE"

                    }
                );


            if (!response) return;


            const data =
                await response.json()
                .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "فشل حذف القسم"
                );

            }


            showMessage(
                "✅ تم حذف القسم",
                "success"
            );


            await loadCategories();

        }

        catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "❌ لا يمكن حذف القسم",
                "error"
            );

        }

    }


    /* =========================
       الإحصائيات
    ========================= */

    function updateStats() {

        document
            .getElementById(
                "totalCategories"
            )
            .textContent =
                categories.length;


        const total =
            categories.reduce(
                (sum, category) => {

                    return sum +
                        Number(
                            category.product_count ??
                            category.products_count ??
                            category.productsCount ??
                            0
                        );

                },
                0
            );


        document
            .getElementById(
                "totalProducts"
            )
            .textContent =
                total;

    }


    /* =========================
       رسالة
    ========================= */

    let messageTimer;


    function showMessage(text, type) {

        const box =
            document.getElementById(
                "message"
            );


        box.textContent = text;


        box.className =
            `message ${type}`;


        clearTimeout(messageTimer);


        messageTimer =
            setTimeout(() => {

                box.className =
                    "message";

            }, 4000);

    }


    /* =========================
       حماية HTML
    ========================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       إغلاق الـ Modal
       عند الضغط خارج النافذة
    ========================= */

    document
        .getElementById("editModal")
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeEditModal();

                }

            }
        );


    /* =========================
       تشغيل الصفحة
    ========================= */

    loadCategories();

</script>

</body>

</html>
