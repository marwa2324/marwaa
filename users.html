<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title> - المستخدمين</title>
<link rel="stylesheet" href="theme.css">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #060a12;
    --bg-secondary: #0a1220;

    --navy: #0d1728;
    --navy-light: #14243d;

    --card: #0e192b;
    --card-light: #111f34;

    --blue: #1683ff;
    --blue-light: #43a7ff;
    --blue-dark: #075fc2;

    --white: #f5f8ff;
    --text: #e5edf8;
    --muted: #8e9caf;

    --border: rgba(91, 145, 210, .18);
    --border-blue: rgba(22, 131, 255, .35);

    --green: #22c77a;
    --red: #ff5264;
    --yellow: #ffc247;

    --shadow: 0 18px 50px rgba(0, 0, 0, .38);
}

/* =========================
   BODY
========================= */

body {
    font-family: Arial, "Segoe UI", sans-serif;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(22, 131, 255, .08),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 100%,
            rgba(22, 131, 255, .06),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    direction: rtl;
}

/* =========================
   HEADER
========================= */

header {
    position: relative;

    background:
        linear-gradient(
            135deg,
            #070c16,
            #0d1728 55%,
            #101f36
        );

    color: var(--white);

    padding: 18px 28px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
        1px solid var(--border-blue);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, .35),
        0 0 25px rgba(22, 131, 255, .07);

    overflow: hidden;
}

header::after {
    content: "";

    position: absolute;

    left: -10%;
    right: -10%;
    bottom: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            var(--blue-light),
            var(--blue),
            transparent
        );

    opacity: .7;

    animation:
        headerGlow 4s ease-in-out infinite;
}

@keyframes headerGlow {

    0%, 100% {
        opacity: .35;
    }

    50% {
        opacity: .95;
    }
}

.logo {
    color: var(--blue-light);

    font-size: 24px;

    font-weight: bold;

    text-shadow:
        0 0 14px rgba(67, 167, 255, .35);
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;

    margin: auto;

    padding: 28px 22px 45px;
}

/* =========================
   BOX
========================= */

.box {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(17, 31, 52, .96),
            rgba(9, 17, 30, .98)
        );

    padding: 22px;

    border-radius: 18px;

    margin-bottom: 22px;

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    overflow: hidden;

    animation:
        boxAppear .55s ease both;
}

.box::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            transparent
        );

    opacity: .75;
}

.box::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -100px;
    left: -100px;

    border-radius: 50%;

    background:
        rgba(22, 131, 255, .06);

    filter: blur(30px);

    pointer-events: none;
}

.box:nth-child(2) {
    animation-delay: .08s;
}

@keyframes boxAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   TITLES
========================= */

h2 {
    margin-bottom: 18px;

    color: var(--white);

    font-size: 21px;

    font-weight: 700;

    padding-bottom: 13px;

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    gap: 8px;
}

/* =========================
   FORM
========================= */

.form {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

/* =========================
   INPUTS
========================= */

input,
select {
    width: 100%;

    padding: 13px 14px;

    background:
        rgba(5, 11, 20, .78);

    color: var(--text);

    border:
        1px solid rgba(91, 145, 210, .2);

    border-radius: 10px;

    font-size: 14px;

    font-family: inherit;

    outline: none;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        transform .2s ease;
}

input::placeholder {
    color: #718097;
}

input:hover,
select:hover {
    border-color:
        rgba(67, 167, 255, .32);
}

input:focus,
select:focus {
    border-color:
        var(--blue);

    background:
        rgba(10, 23, 40, .96);

    box-shadow:
        0 0 0 3px
        rgba(22, 131, 255, .08),
        0 0 20px
        rgba(22, 131, 255, .12);

    transform:
        translateY(-1px);
}

/* =========================
   SELECT
========================= */

select {
    cursor: pointer;

    appearance: auto;
}

select option {
    background: #0d1728;

    color: var(--text);
}

/* =========================
   BUTTON BASE
========================= */

button {
    border: 0;

    border-radius: 9px;

    padding: 11px 16px;

    cursor: pointer;

    font-weight: bold;

    font-family: inherit;

    transition:
        transform .2s ease,
        box-shadow .25s ease,
        background .25s ease,
        border-color .25s ease;
}

button:active {
    transform: scale(.97);
}

/* =========================
   SAVE BUTTON
========================= */

.save {
    position: relative;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color: white;

    padding:
        13px 20px;

    overflow: hidden;

    box-shadow:
        0 10px 25px
        rgba(22, 131, 255, .18);
}

.save::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .65s ease;
}

.save:hover::before {
    left: 130%;
}

.save:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(22, 131, 255, .3),
        0 0 20px
        rgba(22, 131, 255, .1);
}

/* =========================
   SEARCH
========================= */

.search {
    margin-bottom: 17px;

    display: block;
}

/* =========================
   TABLE CONTAINER
========================= */

.table-container {
    width: 100%;

    overflow-x: auto;

    border:
        1px solid var(--border);

    border-radius: 13px;

    background:
        rgba(6, 13, 23, .45);

    scrollbar-width: thin;

    scrollbar-color:
        var(--blue-dark)
        #080e18;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 700px;
}

/* =========================
   TABLE HEADER
========================= */

th {
    padding: 15px 14px;

    background:
        linear-gradient(
            135deg,
            #0d1a2e,
            #101f36
        );

    color: var(--white);

    border-bottom:
        1px solid
        rgba(67, 167, 255, .18);

    text-align: right;

    font-size: 14px;

    white-space: nowrap;
}

/* =========================
   TABLE CELLS
========================= */

td {
    padding: 14px;

    color: var(--text);

    border-bottom:
        1px solid
        rgba(91, 145, 210, .1);

    text-align: right;

    font-size: 14px;

    transition:
        background .2s ease;
}

tbody tr {
    transition:
        background .2s ease,
        transform .2s ease;
}

tbody tr:hover {
    background:
        rgba(22, 131, 255, .06);
}

tbody tr:last-child td {
    border-bottom: 0;
}

/* =========================
   ACTIVE STATUS
========================= */

.active {
    color:
        #45e39a;

    font-weight:
        bold;

    white-space:
        nowrap;
}

.active::before {
    content: "●";

    display: inline-block;

    margin-left: 6px;

    font-size: 9px;

    color:
        var(--green);

    text-shadow:
        0 0 8px
        rgba(34, 199, 122, .7);
}

/* =========================
   INACTIVE STATUS
========================= */

.inactive {
    color:
        #ff7582;

    font-weight:
        bold;

    white-space:
        nowrap;
}

.inactive::before {
    content: "●";

    display: inline-block;

    margin-left: 6px;

    font-size: 9px;

    color:
        var(--red);

    text-shadow:
        0 0 8px
        rgba(255, 82, 100, .6);
}

/* =========================
   DEACTIVATE
========================= */

.deactivate {
    background:
        rgba(255, 82, 100, .1);

    color:
        #ff7280;

    border:
        1px solid
        rgba(255, 82, 100, .2);

    padding:
        8px 13px;
}

.deactivate:hover {
    background:
        rgba(255, 82, 100, .19);

    color:
        #ff9ca6;

    border-color:
        rgba(255, 82, 100, .35);

    box-shadow:
        0 0 16px
        rgba(255, 82, 100, .1);

    transform:
        translateY(-2px);
}

/* =========================
   ACTIVATE
========================= */

.activate {
    background:
        rgba(34, 199, 122, .12);

    color:
        #4ce49a;

    border:
        1px solid
        rgba(34, 199, 122, .2);

    padding:
        8px 13px;
}

.activate:hover {
    background:
        rgba(34, 199, 122, .2);

    color:
        #72f0b0;

    border-color:
        rgba(34, 199, 122, .35);

    box-shadow:
        0 0 16px
        rgba(34, 199, 122, .1);

    transform:
        translateY(-2px);
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;

    padding: 40px 20px;

    color:
        var(--muted);

    background:
        rgba(6, 13, 23, .5);

    border:
        1px dashed
        rgba(91, 145, 210, .18);

    border-radius:
        12px;

    animation:
        emptyAppear .4s ease;
}

@keyframes emptyAppear {

    from {
        opacity: 0;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #080e18;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            var(--blue),
            var(--blue-dark)
        );

    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background:
        var(--blue-light);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    main {
        padding:
            22px 16px 35px;
    }

    .form {
        grid-template-columns:
            1fr;
    }
}

@media(max-width: 600px) {

    header {
        padding:
            15px 16px;
    }

    .logo {
        font-size: 20px;
    }

    header > div:last-child {
        font-size: 14px;
    }

    main {
        padding:
            15px 10px 30px;
    }

    .box {
        padding:
            17px 14px;

        border-radius:
            15px;
    }

    h2 {
        font-size:
            18px;
    }

    .save {
        width: 100%;
    }

    .table-container {
        border-radius:
            11px;
    }

    th,
    td {
        padding:
            12px 10px;

        font-size:
            13px;
    }
}

@media(max-width: 400px) {

    .box {
        padding:
            15px 12px;
    }

    h2 {
        font-size:
            17px;
    }

    input,
    select {
        font-size:
            13px;
    }

    .save {
        font-size:
            14px;
    }
}
</style>

</head>

<body>

<header>

    <div class="logo">
        
    </div>

    <div>
        👥 المستخدمين
    </div>

</header>


<main>

    <section class="box">

        <h2>
            👤 إضافة مستخدم
        </h2>

        <div class="form">

            <input
                id="name"
                placeholder="اسم الموظف"
            >

            <input
                id="username"
                placeholder="اسم المستخدم"
            >

            <input
                id="password"
                type="password"
                placeholder="كلمة السر"
            >

            <select id="role">

                <option value="employee">
                    موظف
                </option>

                <option value="manager">
                    مدير
                </option>

                <option value="admin">
                    مدير النظام
                </option>

            </select>

        </div>

        <br>

        <button
            class="save"
            onclick="createUser()">

            💾 إضافة المستخدم

        </button>

    </section>


    <section class="box">

        <h2>
            📋 المستخدمين
        </h2>

        <input
            class="search"
            id="search"
            placeholder="🔎 البحث عن مستخدم..."
            oninput="filterUsers()"
        >

        <div class="table-container"
             id="usersTable">

            <div class="empty">
                جاري التحميل...
            </div>

        </div>

    </section>

</main>


<script>

const API = "http://localhost:3000/api";
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

async function apiFetch(url, options = {}) {

    const currentToken = localStorage.getItem("token");

    if (!currentToken) {
        window.location.href = "login.html";
        return;
    }

    options.headers = {
        ...(options.headers || {}),
        "Authorization": `Bearer ${currentToken}`
    };

    const response = await fetch(url, options);

    if (response.status === 401) {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
        return;
    }

    return response;
}
let users = [];


/* تحميل المستخدمين */

async function loadUsers() {

    try {

        const response =
            await apiFetch(`${API}/users`);

        const data =
            await response.json();

        users =
            data.users || [];

        renderUsers(users);

    } catch (error) {

        document.getElementById("usersTable")
            .innerHTML = `
                <div class="empty">
                    ❌ تعذر تحميل المستخدمين
                </div>
            `;
    }
}


/* عرض المستخدمين */

function renderUsers(list) {

    const container =
        document.getElementById("usersTable");

    if (!list.length) {

        container.innerHTML = `
            <div class="empty">
                لا يوجد مستخدمون
            </div>
        `;

        return;
    }

    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>الاسم</th>
                    <th>اسم المستخدم</th>
                    <th>الصلاحية</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>

                </tr>

            </thead>

            <tbody>

                ${list.map(user => `

                    <tr>

                        <td>
                            ${escapeHtml(user.name || "-")}
                        </td>

                        <td>
                            ${escapeHtml(user.username || "-")}
                        </td>

                        <td>
                            ${roleName(user.role)}
                        </td>

                        <td class="${
                            user.is_active
                            ? "active"
                            : "inactive"
                        }">

                            ${
                                user.is_active
                                ? "نشط"
                                : "معطل"
                            }

                        </td>

                        <td>

                            ${
                                user.is_active

                                ?

                                `
                                <button
                                    class="deactivate"
                                    onclick="changeStatus(
                                        '${user.id}',
                                        false
                                    )">

                                    تعطيل

                                </button>
                                `

                                :

                                `
                                <button
                                    class="activate"
                                    onclick="changeStatus(
                                        '${user.id}',
                                        true
                                    )">

                                    تفعيل

                                </button>
                                `
                            }

                        </td>

                    </tr>

                `).join("")}

            </tbody>

        </table>
    `;
}


/* إنشاء مستخدم */

async function createUser() {

    const name =
        document.getElementById("name")
            .value.trim();

    const username =
        document.getElementById("username")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const role =
        document.getElementById("role")
            .value;


    if (!name ||
        !username ||
        !password) {

        alert(
            "من فضلك اكملي البيانات"
        );

        return;
    }


    try {

        const response =
            await apiFetch(
                `${API}/users`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        username,
                        password,
                        role
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "حدث خطأ"
            );
        }


        alert(
            "✅ تم إنشاء المستخدم"
        );


        document.getElementById("name")
            .value = "";

        document.getElementById("username")
            .value = "";

        document.getElementById("password")
            .value = "";

        document.getElementById("role")
            .value = "employee";


        loadUsers();


    } catch (error) {

        alert(
            "❌ " + error.message
        );
    }
}


/* تغيير حالة المستخدم */

async function changeStatus(
    id,
    active
) {

    const message =
        active
        ? "هل تريد تفعيل المستخدم؟"
        : "هل تريد تعطيل المستخدم؟";

    if (!confirm(message)) {
        return;
    }


    try {

        const response =
            await apiFetch(
                `${API}/users/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        is_active: active
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "حدث خطأ"
            );
        }


        loadUsers();


    } catch (error) {

        alert(
            "❌ " + error.message
        );
    }
}


/* البحث */

function filterUsers() {

    const value =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        users.filter(user =>

            (user.name || "")
                .toLowerCase()
                .includes(value)

            ||

            (user.username || "")
                .toLowerCase()
                .includes(value)
        );


    renderUsers(filtered);
}


/* أسماء الصلاحيات */

function roleName(role) {

    if (role === "admin")
        return "👑 مدير النظام";

    if (role === "manager")
        return "⭐ مدير";

    return "👨‍💼 موظف";
}


/* حماية النص */

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadUsers();
</script>
</body>
</html>
