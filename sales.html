<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> المبيعات</title>
<link rel="stylesheet" href="theme.css">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #060a12;
    --bg-secondary: #0a1220;

    --navy: #0d1728;
    --navy-light: #14243d;

    --card: #0e192b;
    --card-light: #111f34;

    --blue: #1683ff;
    --blue-light: #43a7ff;
    --blue-dark: #075fc2;

    --white: #f5f8ff;
    --text: #e5edf8;
    --muted: #8e9caf;

    --border: rgba(91, 145, 210, .18);
    --border-blue: rgba(22, 131, 255, .35);

    --green: #22c77a;
    --red: #ff5264;
    --yellow: #ffc247;

    --shadow: 0 18px 50px rgba(0, 0, 0, .38);
}

/* =========================
   BODY
========================= */

body {
    font-family: Arial, "Segoe UI", sans-serif;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(22, 131, 255, .08),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 100%,
            rgba(22, 131, 255, .06),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    direction: rtl;
}

/* =========================
   HEADER
========================= */

header {
    position: relative;

    background:
        linear-gradient(
            135deg,
            #070c16,
            #0d1728 55%,
            #101f36
        );

    color: var(--white);

    padding: 18px 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid var(--border-blue);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, .35),
        0 0 25px rgba(22, 131, 255, .07);

    overflow: hidden;
}

header::after {
    content: "";

    position: absolute;

    left: -10%;
    right: -10%;
    bottom: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            var(--blue-light),
            var(--blue),
            transparent
        );

    opacity: .7;

    animation: headerGlow 4s ease-in-out infinite;
}

@keyframes headerGlow {

    0%, 100% {
        opacity: .35;
    }

    50% {
        opacity: .95;
    }
}

.logo {
    color: var(--blue-light);

    font-size: 24px;

    font-weight: bold;

    text-shadow:
        0 0 14px rgba(67, 167, 255, .35);
}

/* =========================
   MAIN
========================= */

main {
    padding: 28px 22px 45px;

    max-width: 1400px;

    margin: auto;
}

/* =========================
   LAYOUT
========================= */

.layout {
    display: grid;

    grid-template-columns: 2fr 1fr;

    gap: 22px;

    align-items: start;
}

/* =========================
   BOX
========================= */

.box {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(17, 31, 52, .96),
            rgba(9, 17, 30, .98)
        );

    border-radius: 18px;

    padding: 22px;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    overflow: hidden;

    animation: boxAppear .55s ease both;
}

.box::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            transparent
        );

    opacity: .75;
}

.box::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -100px;
    left: -100px;

    border-radius: 50%;

    background:
        rgba(22, 131, 255, .06);

    filter: blur(30px);

    pointer-events: none;
}

.box:nth-child(2) {
    animation-delay: .08s;
}

@keyframes boxAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   TITLES
========================= */

h2 {
    margin-bottom: 18px;

    color: var(--white);

    font-size: 21px;

    font-weight: 700;

    display: flex;
    align-items: center;

    gap: 8px;

    padding-bottom: 13px;

    border-bottom: 1px solid var(--border);
}

/* =========================
   INPUTS
========================= */

input,
select {
    width: 100%;

    padding: 13px 14px;

    margin-bottom: 12px;

    background:
        rgba(5, 11, 20, .78);

    color: var(--text);

    border: 1px solid rgba(91, 145, 210, .2);

    border-radius: 10px;

    font-size: 14px;

    outline: none;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        transform .2s ease;
}

input::placeholder,
select::placeholder {
    color: #718097;
}

input:hover,
select:hover {
    border-color:
        rgba(67, 167, 255, .32);
}

input:focus,
select:focus {
    border-color: var(--blue);

    background:
        rgba(10, 23, 40, .96);

    box-shadow:
        0 0 0 3px rgba(22, 131, 255, .08),
        0 0 20px rgba(22, 131, 255, .12);

    transform: translateY(-1px);
}

/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    gap: 14px;
}

/* =========================
   PRODUCT CARD
========================= */

.product {
    position: relative;

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 17px;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(17, 32, 53, .9),
            rgba(9, 17, 29, .9)
        );

    min-height: 125px;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.product::before {
    content: "";

    position: absolute;

    right: 0;
    top: 12px;
    bottom: 12px;

    width: 3px;

    border-radius: 5px;

    background:
        linear-gradient(
            180deg,
            var(--blue-light),
            var(--blue-dark)
        );

    opacity: .35;

    transition: opacity .25s ease;
}

.product:hover {
    transform: translateY(-4px);

    border-color:
        rgba(67, 167, 255, .45);

    background:
        linear-gradient(
            145deg,
            rgba(18, 39, 66, .96),
            rgba(9, 20, 35, .98)
        );

    box-shadow:
        0 12px 30px rgba(0, 0, 0, .35),
        0 0 22px rgba(22, 131, 255, .1);
}

.product:hover::before {
    opacity: 1;
}

.product strong {
    display: block;

    margin-bottom: 9px;

    color: var(--white);

    font-size: 15px;

    line-height: 1.6;
}

.product > div:not(.price) {
    color: var(--muted);

    font-size: 13px;

    margin-bottom: 6px;
}

/* =========================
   PRICE
========================= */

.price {
    color: var(--blue-light);

    font-weight: bold;

    font-size: 17px;

    margin-top: 8px;

    text-shadow:
        0 0 12px rgba(67, 167, 255, .18);
}

/* =========================
   CART
========================= */

#cart {
    margin-top: 4px;

    max-height: 460px;

    overflow-y: auto;

    padding-left: 3px;

    scrollbar-width: thin;

    scrollbar-color:
        var(--blue-dark)
        #0a1220;
}

/* =========================
   CART ITEM
========================= */

.cart-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
        1px solid rgba(91, 145, 210, .12);

    padding: 15px 3px;

    gap: 12px;

    animation: cartAppear .3s ease;
}

.cart-item:last-child {
    border-bottom: 0;
}

@keyframes cartAppear {

    from {
        opacity: 0;
        transform: translateX(10px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.cart-item > div:first-child {
    flex: 1;
}

.cart-item > div:first-child strong:first-child {
    display: block;

    color: var(--white);

    font-size: 15px;

    margin-bottom: 6px;
}

.cart-item > div:first-child div {
    color: var(--muted);

    font-size: 13px;

    margin-bottom: 6px;
}

.cart-item > div:first-child strong:last-child {
    color: var(--blue-light);

    font-size: 15px;

    text-shadow:
        0 0 10px rgba(67, 167, 255, .15);
}

/* =========================
   CART BUTTONS
========================= */

.cart-item button {
    background:
        #17273f;

    color: #dce8f7;

    border:
        1px solid rgba(91, 145, 210, .18);

    border-radius: 7px;

    padding: 7px 11px;

    cursor: pointer;

    transition:
        .2s ease;
}

.cart-item button:hover {
    background:
        #204267;

    color: white;

    border-color:
        rgba(67, 167, 255, .35);

    transform: translateY(-2px);

    box-shadow:
        0 0 13px rgba(22, 131, 255, .1);
}

/* زر الحذف */
.cart-item button:last-child {
    background:
        rgba(255, 82, 100, .1);

    color: #ff7280;

    border-color:
        rgba(255, 82, 100, .2);
}

.cart-item button:last-child:hover {
    background:
        rgba(255, 82, 100, .19);

    color: #ff9ca6;

    box-shadow:
        0 0 14px rgba(255, 82, 100, .1);
}

/* =========================
   TOTAL
========================= */

.total {
    font-size: 21px;

    font-weight: bold;

    margin: 20px 0;

    padding: 17px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            rgba(22, 131, 255, .1),
            rgba(7, 17, 31, .8)
        );

    border:
        1px solid rgba(22, 131, 255, .2);

    color: var(--white);

    box-shadow:
        inset 0 0 25px rgba(22, 131, 255, .03);
}

#total {
    color: var(--blue-light);

    font-size: 25px;

    margin: 0 4px;

    text-shadow:
        0 0 14px rgba(67, 167, 255, .2);
}

/* =========================
   CHECKOUT
========================= */

.checkout {
    position: relative;

    width: 100%;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color: white;

    border: 0;

    border-radius: 11px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 10px 25px rgba(22, 131, 255, .2);

    transition:
        transform .2s ease,
        box-shadow .25s ease;
}

.checkout::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform: skewX(-20deg);

    transition:
        left .65s ease;
}

.checkout:hover::before {
    left: 130%;
}

.checkout:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(22, 131, 255, .32),
        0 0 20px rgba(22, 131, 255, .12);
}

.checkout:active {
    transform: translateY(0);
}

/* =========================
   EMPTY
========================= */

.empty {
    color: var(--muted);

    text-align: center;

    padding: 38px 20px;

    background:
        rgba(6, 13, 23, .5);

    border:
        1px dashed rgba(91, 145, 210, .18);

    border-radius: 12px;

    animation: emptyAppear .4s ease;
}

@keyframes emptyAppear {

    from {
        opacity: 0;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #080e18;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            var(--blue),
            var(--blue-dark)
        );

    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--blue-light);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 1000px) {

    .layout {
        grid-template-columns: 1.5fr 1fr;
    }

    main {
        padding: 22px 16px 35px;
    }
}

@media(max-width: 800px) {

    header {
        padding: 16px 20px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .box:first-child {
        order: 1;
    }

    .box:nth-child(2) {
        order: 2;
    }

    #cart {
        max-height: none;
    }
}

@media(max-width: 600px) {

    header {
        padding: 15px 16px;
    }

    .logo {
        font-size: 20px;
    }

    header > div:last-child {
        font-size: 14px;
    }

    main {
        padding: 15px 10px 30px;
    }

    .box {
        padding: 17px 14px;

        border-radius: 15px;
    }

    h2 {
        font-size: 18px;
    }

    .products {
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(145px, 1fr)
            );
    }

    .product {
        padding: 14px;

        min-height: 115px;
    }

    .price {
        font-size: 16px;
    }

    .cart-item {
        align-items: flex-start;

        flex-direction: column;
    }

    .cart-item > div:last-child {
        width: 100%;

        display: flex;

        flex-wrap: wrap;

        gap: 5px;
    }

    .cart-item button {
        flex: 1;
    }

    .total {
        font-size: 19px;
    }

    #total {
        font-size: 23px;
    }
}

@media(max-width: 400px) {

    .products {
        grid-template-columns: 1fr 1fr;

        gap: 9px;
    }

    .product {
        padding: 12px;
    }

    .product strong {
        font-size: 14px;
    }

    .checkout {
        font-size: 15px;
    }
}
    </style>
</head>

<body>

<header>
    <div class="logo"> </div>
    <div>🧾 المبيعات</div>
</header>

<main>

    <div class="layout">

        <!-- المنتجات -->
        <section class="box">

            <h2>🏪 المنتجات</h2>

            <input
                type="text"
                id="search"
                placeholder="ابحث باسم المنتج أو الباركود..."
                oninput="searchProducts()"
            >

            <div id="products" class="products">
                <div class="empty">جاري تحميل المنتجات...</div>
            </div>

        </section>

        <!-- الفاتورة -->
        <section class="box">

            <h2>🧾 الفاتورة</h2>

            <input
                id="invoiceNumber"
                placeholder="رقم الفاتورة"
            >

            <input
                id="customerId"
                placeholder="رقم العميل اختياري"
            >

            <div id="cart">
                <div class="empty">
                    لم يتم إضافة منتجات
                </div>
            </div>

            <div class="total">
                الإجمالي:
                <span id="total">0</span>
                جنيه
            </div>

            <input
                type="number"
                id="paidAmount"
                placeholder="المبلغ المدفوع"
                min="0"
            >

            <button class="checkout" onclick="createInvoice()">
                💰 إصدار الفاتورة
            </button>

        </section>

    </div>

</main>

<script>

const API = "http://localhost:3000/api";
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

async function apiFetch(url, options = {}) {

    const currentToken =
        localStorage.getItem("token");

    if (!currentToken) {
        window.location.href = "login.html";
        return;
    }

    options.headers = {
        ...(options.headers || {}),
        "Authorization":
            `Bearer ${currentToken}`
    };

    const response =
        await fetch(url, options);

    if (response.status === 401) {

        localStorage.removeItem("token");
        localStorage.removeItem("user");

        window.location.href = "login.html";

        return;
    }

    return response;
}
let products = [];
let cart = [];

async function loadProducts() {

    try {

        const response = await apiFetch(`${API}/products`);
        const data = await response.json();

        products = data.products || [];

        renderProducts(products);

    } catch (error) {

        console.error(error);

        document.getElementById("products").innerHTML =
            `<div class="empty">❌ تعذر تحميل المنتجات</div>`;
    }
}

function renderProducts(list) {

    const container = document.getElementById("products");

    if (!list.length) {
        container.innerHTML =
            `<div class="empty">لا توجد منتجات</div>`;
        return;
    }

    container.innerHTML = list.map(product => `
        <div class="product"
             onclick="addToCart('${product.id}')">

            <strong>${escapeHtml(product.name)}</strong>

            <div>
                المخزون:
                ${product.current_stock}
            </div>

            <div class="price">
                ${product.retail_price} جنيه
            </div>

        </div>
    `).join("");
}

function searchProducts() {

    const value =
        document.getElementById("search").value
        .trim()
        .toLowerCase();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(value) ||
        (product.barcode || "").toLowerCase().includes(value)
    );

    renderProducts(filtered);
}

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    if (Number(product.current_stock) <= 0) {
        alert("المنتج غير متوفر في المخزون");
        return;
    }

    const existing =
        cart.find(item => item.product_id === id);

    if (existing) {

        if (existing.quantity >= Number(product.current_stock)) {
            alert("الكمية المطلوبة أكبر من المخزون");
            return;
        }

        existing.quantity++;

    } else {

        cart.push({
            product_id: product.id,
            name: product.name,
            quantity: 1,
            unit_price: Number(product.retail_price),
            max_stock: Number(product.current_stock)
        });
    }

    renderCart();
}

function removeFromCart(id) {

    cart = cart.filter(
        item => item.product_id !== id
    );

    renderCart();
}

function changeQuantity(id, change) {

    const item =
        cart.find(item => item.product_id === id);

    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {
        removeFromCart(id);
        return;
    }

    if (item.quantity > item.max_stock) {
        item.quantity = item.max_stock;
        alert("لا توجد كمية كافية في المخزون");
    }

    renderCart();
}

function renderCart() {

    const container =
        document.getElementById("cart");

    if (!cart.length) {

        container.innerHTML =
            `<div class="empty">لم يتم إضافة منتجات</div>`;

        document.getElementById("total").textContent = "0";

        return;
    }

    container.innerHTML = cart.map(item => {

        const itemTotal =
            item.quantity * item.unit_price;

        return `
            <div class="cart-item">

                <div>
                    <strong>${escapeHtml(item.name)}</strong>
                    <div>
                        ${item.quantity} ×
                        ${item.unit_price}
                    </div>
                    <strong>
                        ${itemTotal.toFixed(2)} جنيه
                    </strong>
                </div>

                <div>
                    <button onclick="changeQuantity('${item.product_id}', 1)">
                        +
                    </button>

                    <button onclick="changeQuantity('${item.product_id}', -1)">
                        -
                    </button>

                    <button onclick="removeFromCart('${item.product_id}')">
                        حذف
                    </button>
                </div>

            </div>
        `;

    }).join("");

    calculateTotal();
}

function calculateTotal() {

    const total = cart.reduce(
        (sum, item) =>
            sum + (item.quantity * item.unit_price),
        0
    );

    document.getElementById("total").textContent =
        total.toFixed(2);

    return total;
}

async function createInvoice() {

    if (!cart.length) {
        alert("أضيفي منتج واحد على الأقل");
        return;
    }

    const invoiceNumber =
        document.getElementById("invoiceNumber").value.trim();

    if (!invoiceNumber) {
        alert("اكتبي رقم الفاتورة");
        return;
    }

    const customerId =
        document.getElementById("customerId").value.trim();

    const paidAmount =
        Number(document.getElementById("paidAmount").value || 0);

    try {

        const invoiceResponse = await apiFetch(
            `${API}/sales-invoices`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    invoice_number: invoiceNumber,
                    customer_id: customerId || null,
                    paid_amount: paidAmount,
                    discount: 0,
                    tax: 0
                })
            }
        );

        const invoiceData =
            await invoiceResponse.json();

        if (!invoiceResponse.ok) {
            throw new Error(invoiceData.message);
        }

        const invoiceId =
            invoiceData.invoice_id;

        for (const item of cart) {

            const response = await apiFetch(
                `${API}/sales-invoices/${invoiceId}/items`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        product_id: item.product_id,
                        quantity: item.quantity,
                        unit_price: item.unit_price,
                        discount: 0
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message);
            }
        }

        const finalizeResponse = await apiFetch(
            `${API}/sales-invoices/${invoiceId}/finalize`,
            {
                method: "POST"
            }
        );

        const finalizeData =
            await finalizeResponse.json();

        if (!finalizeResponse.ok) {
            throw new Error(finalizeData.message);
        }

        alert("✅ تم إصدار الفاتورة بنجاح");

        cart = [];

        document.getElementById("invoiceNumber").value = "";

        document.getElementById("customerId").value = "";

        document.getElementById("paidAmount").value = "";

        renderCart();

        loadProducts();

    } catch (error) {

        console.error(error);

        alert("❌ حدث خطأ: " + error.message);
    }
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadProducts();

</script>
