<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> الموردين</title>
<link rel="stylesheet" href="theme.css">
    <style>
       * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #060a12;
    --bg-secondary: #0a1220;

    --navy: #0d1728;
    --navy-light: #14243d;

    --card: #0e192b;
    --card-light: #111f34;

    --blue: #1683ff;
    --blue-light: #43a7ff;
    --blue-dark: #075fc2;

    --white: #f5f8ff;
    --text: #e5edf8;
    --muted: #8e9caf;

    --border: rgba(91, 145, 210, .18);
    --border-blue: rgba(22, 131, 255, .35);

    --green: #22c77a;
    --red: #ff5264;
    --yellow: #ffc247;

    --shadow: 0 18px 50px rgba(0, 0, 0, .38);
}

/* =========================
   BODY
========================= */

body {
    font-family: Arial, "Segoe UI", sans-serif;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(22, 131, 255, .08),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 100%,
            rgba(22, 131, 255, .06),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    direction: rtl;
}

/* =========================
   HEADER
========================= */

header {
    position: relative;

    background:
        linear-gradient(
            135deg,
            #070c16,
            #0d1728 55%,
            #101f36
        );

    color: var(--white);

    padding: 18px 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid var(--border-blue);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, .35),
        0 0 25px rgba(22, 131, 255, .07);

    overflow: hidden;
}

header::after {
    content: "";

    position: absolute;

    left: -10%;
    right: -10%;
    bottom: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            var(--blue-light),
            var(--blue),
            transparent
        );

    opacity: .7;

    animation: headerGlow 4s ease-in-out infinite;
}

@keyframes headerGlow {

    0%, 100% {
        opacity: .35;
    }

    50% {
        opacity: .95;
    }
}

.logo {
    color: var(--blue-light);

    font-size: 24px;

    font-weight: bold;

    text-shadow:
        0 0 14px rgba(67, 167, 255, .35);
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1400px;

    margin: auto;

    padding: 28px 22px 45px;
}

/* =========================
   LAYOUT
========================= */

.layout {
    display: grid;

    grid-template-columns: 350px 1fr;

    gap: 22px;

    align-items: start;
}

/* =========================
   BOX
========================= */

.box {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(17, 31, 52, .96),
            rgba(9, 17, 30, .98)
        );

    padding: 22px;

    border-radius: 18px;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    overflow: hidden;

    animation: boxAppear .55s ease both;
}

.box::before {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            transparent
        );

    opacity: .75;
}

.box::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -100px;
    left: -100px;

    border-radius: 50%;

    background:
        rgba(22, 131, 255, .06);

    filter: blur(30px);

    pointer-events: none;
}

.box:nth-child(2) {
    animation-delay: .08s;
}

@keyframes boxAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   TITLES
========================= */

h2 {
    margin-bottom: 18px;

    color: var(--white);

    font-size: 21px;

    font-weight: 700;

    padding-bottom: 13px;

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    gap: 8px;
}

/* =========================
   INPUTS
========================= */

input,
textarea {
    width: 100%;

    padding: 13px 14px;

    margin-bottom: 12px;

    background:
        rgba(5, 11, 20, .78);

    color: var(--text);

    border: 1px solid rgba(91, 145, 210, .2);

    border-radius: 10px;

    font-size: 14px;

    font-family: inherit;

    outline: none;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        transform .2s ease;
}

input::placeholder,
textarea::placeholder {
    color: #718097;
}

input:hover,
textarea:hover {
    border-color:
        rgba(67, 167, 255, .32);
}

input:focus,
textarea:focus {
    border-color: var(--blue);

    background:
        rgba(10, 23, 40, .96);

    box-shadow:
        0 0 0 3px rgba(22, 131, 255, .08),
        0 0 20px rgba(22, 131, 255, .12);

    transform: translateY(-1px);
}

textarea {
    min-height: 100px;

    resize: vertical;

    line-height: 1.6;
}

/* =========================
   BUTTON BASE
========================= */

button {
    border: 0;

    border-radius: 9px;

    padding: 11px 15px;

    cursor: pointer;

    font-weight: bold;

    font-family: inherit;

    transition:
        transform .2s ease,
        box-shadow .25s ease,
        background .25s ease,
        border-color .25s ease;
}

button:active {
    transform: scale(.97);
}

/* =========================
   ADD BUTTON
========================= */

.add-btn {
    position: relative;

    width: 100%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color: white;

    font-size: 16px;

    padding: 14px;

    overflow: hidden;

    box-shadow:
        0 10px 25px rgba(22, 131, 255, .18);
}

.add-btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .65s ease;
}

.add-btn:hover::before {
    left: 130%;
}

.add-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(22, 131, 255, .3),
        0 0 20px rgba(22, 131, 255, .1);
}

/* =========================
   SUPPLIER
========================= */

.supplier {
    position: relative;

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 17px;

    margin-bottom: 12px;

    display: flex;

    justify-content: space-between;

    gap: 18px;

    align-items: center;

    background:
        linear-gradient(
            145deg,
            rgba(17, 32, 53, .9),
            rgba(9, 17, 29, .92)
        );

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;

    animation: supplierAppear .35s ease both;
}

.supplier::before {
    content: "";

    position: absolute;

    right: 0;
    top: 12px;
    bottom: 12px;

    width: 3px;

    border-radius: 5px;

    background:
        linear-gradient(
            180deg,
            var(--blue-light),
            var(--blue-dark)
        );

    opacity: .4;

    transition: opacity .25s ease;
}

.supplier:hover {
    transform: translateY(-3px);

    border-color:
        rgba(67, 167, 255, .4);

    background:
        linear-gradient(
            145deg,
            rgba(18, 39, 66, .96),
            rgba(9, 20, 35, .98)
        );

    box-shadow:
        0 12px 30px rgba(0, 0, 0, .32),
        0 0 22px rgba(22, 131, 255, .09);
}

.supplier:hover::before {
    opacity: 1;
}

@keyframes supplierAppear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   SUPPLIER NAME
========================= */

.supplier h3 {
    margin-bottom: 8px;

    color: var(--white);

    font-size: 17px;

    line-height: 1.5;
}

/* =========================
   INFO
========================= */

.info {
    color: var(--muted);

    line-height: 1.9;

    font-size: 13px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    justify-content: flex-start;
}

.actions button {
    min-width: 105px;
}

/* =========================
   ACCOUNT BUTTON
========================= */

.account-btn {
    background:
        #17273f;

    color: #dce8f7;

    border:
        1px solid rgba(91, 145, 210, .2);
}

.account-btn:hover {
    background:
        #204267;

    color: white;

    border-color:
        rgba(67, 167, 255, .4);

    box-shadow:
        0 0 16px rgba(22, 131, 255, .12);

    transform: translateY(-2px);
}

/* =========================
   PAYMENT BUTTON
========================= */

.payment-btn {
    background:
        rgba(34, 199, 122, .12);

    color: #4ce49a;

    border:
        1px solid rgba(34, 199, 122, .2);
}

.payment-btn:hover {
    background:
        rgba(34, 199, 122, .2);

    color: #72f0b0;

    border-color:
        rgba(34, 199, 122, .35);

    box-shadow:
        0 0 16px rgba(34, 199, 122, .1);

    transform: translateY(-2px);
}

/* =========================
   DELETE / DISABLE BUTTON
========================= */

.delete-btn {
    background:
        rgba(255, 82, 100, .1);

    color: #ff7280;

    border:
        1px solid rgba(255, 82, 100, .2);
}

.delete-btn:hover {
    background:
        rgba(255, 82, 100, .19);

    color: #ff9ca6;

    border-color:
        rgba(255, 82, 100, .35);

    box-shadow:
        0 0 16px rgba(255, 82, 100, .1);

    transform: translateY(-2px);
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;

    color: var(--muted);

    padding: 40px 20px;

    background:
        rgba(6, 13, 23, .5);

    border:
        1px dashed rgba(91, 145, 210, .18);

    border-radius: 12px;

    animation: emptyAppear .4s ease;
}

@keyframes emptyAppear {

    from {
        opacity: 0;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   SEARCH
========================= */

#search {
    margin-bottom: 17px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #080e18;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            var(--blue),
            var(--blue-dark)
        );

    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--blue-light);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 1100px) {

    .layout {
        grid-template-columns: 300px 1fr;
    }

    .actions button {
        min-width: auto;
    }
}

@media(max-width: 900px) {

    header {
        padding: 16px 20px;
    }

    main {
        padding: 22px 16px 35px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .box:first-child {
        order: 1;
    }

    .box:nth-child(2) {
        order: 2;
    }
}

@media(max-width: 600px) {

    header {
        padding: 15px 16px;
    }

    .logo {
        font-size: 20px;
    }

    header > div:last-child {
        font-size: 14px;
    }

    main {
        padding: 15px 10px 30px;
    }

    .box {
        padding: 17px 14px;

        border-radius: 15px;
    }

    h2 {
        font-size: 18px;
    }

    .supplier {
        flex-direction: column;

        align-items: stretch;

        padding: 15px;
    }

    .actions {
        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 6px;
    }

    .actions button {
        width: 100%;

        min-width: 0;

        padding: 10px 6px;

        font-size: 12px;
    }
}

@media(max-width: 400px) {

    .actions {
        grid-template-columns: 1fr;
    }

    .actions button {
        padding: 11px;
    }

    .supplier h3 {
        font-size: 15px;
    }

    .info {
        font-size: 12px;
    }
}
    </style>
</head>

<body>

<header>
    <div class="logo"> </div>
    <div>🏪 الموردين</div>
</header>

<main>

    <div class="layout">

        <section class="box">

            <h2>➕ إضافة مورد</h2>

            <input id="name" placeholder="اسم المورد *">

            <input id="phone" placeholder="رقم الهاتف">

            <input id="address" placeholder="العنوان">

            <textarea
                id="notes"
                placeholder="ملاحظات">
            </textarea>

            <button
                class="add-btn"
                onclick="addSupplier()">
                إضافة المورد
            </button>

        </section>


        <section class="box">

            <h2>📋 قائمة الموردين</h2>

            <input
                id="search"
                placeholder="🔎 ابحث باسم المورد أو الهاتف..."
                oninput="searchSuppliers()"
            >

            <div id="suppliers">
                <div class="empty">
                    جاري تحميل الموردين...
                </div>
            </div>

        </section>

    </div>

</main>

<script>

const API = "http://localhost:3000/api";
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

async function apiFetch(url, options = {}) {

    const currentToken =
        localStorage.getItem("token");

    if (!currentToken) {
        window.location.href = "login.html";
        return;
    }

    options.headers = {
        ...(options.headers || {}),
        "Authorization":
            `Bearer ${currentToken}`
    };

    const response =
        await fetch(url, options);

    if (response.status === 401) {

        localStorage.removeItem("token");
        localStorage.removeItem("user");

        window.location.href = "login.html";

        return;
    }

    return response;
}
let suppliers = [];


/* تحميل الموردين */

async function loadSuppliers() {

    try {

        const response =
            await apiFetch(`${API}/suppliers`);

        const data =
            await response.json();

        suppliers = data.suppliers || [];

        renderSuppliers(suppliers);

    } catch (error) {

        document.getElementById("suppliers").innerHTML =
            `<div class="empty">
                ❌ تعذر تحميل الموردين
            </div>`;
    }
}


/* عرض الموردين */

function renderSuppliers(list) {

    const container =
        document.getElementById("suppliers");

    if (!list.length) {

        container.innerHTML =
            `<div class="empty">
                لا يوجد موردين
            </div>`;

        return;
    }

    container.innerHTML = list.map(supplier => `

        <div class="supplier">

            <div>

                <h3>
                    🏪 ${escapeHtml(supplier.name)}
                </h3>

                <div class="info">

                    📞 ${escapeHtml(
                        supplier.phone || "بدون هاتف"
                    )}

                    <br>

                    📍 ${escapeHtml(
                        supplier.address || "بدون عنوان"
                    )}

                </div>

            </div>

            <div class="actions">

                <button
                    class="account-btn"
                    onclick="showAccount('${supplier.id}')">
                    💰 الحساب
                </button>

                <button
                    class="payment-btn"
                    onclick="paySupplier('${supplier.id}')">
                    💵 تسجيل دفع
                </button>

                <button
                    class="delete-btn"
                    onclick="deactivateSupplier('${supplier.id}')">
                    تعطيل
                </button>

            </div>

        </div>

    `).join("");
}


/* البحث */

function searchSuppliers() {

    const value =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filtered =
        suppliers.filter(supplier =>
            supplier.name.toLowerCase().includes(value) ||
            (supplier.phone || "")
                .toLowerCase()
                .includes(value)
        );

    renderSuppliers(filtered);
}


/* إضافة مورد */

async function addSupplier() {

    const name =
        document.getElementById("name")
        .value.trim();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const address =
        document.getElementById("address")
        .value.trim();

    const notes =
        document.getElementById("notes")
        .value.trim();

    if (!name) {

        alert("اكتبي اسم المورد");

        return;
    }

    try {

        const response =
            await apiFetch(`${API}/suppliers`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name,
                    phone: phone || null,
                    address: address || null,
                    notes: notes || null
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        alert("✅ تم إضافة المورد");

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("address").value = "";
        document.getElementById("notes").value = "";

        loadSuppliers();

    } catch (error) {

        alert("❌ " + error.message);
    }
}


/* حساب المورد */

async function showAccount(id) {

    try {

        const response =
            await apiFetch(`${API}/suppliers/${id}/account`);

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        const account = data.account;

        let message =
            `اسم المورد: ${account.name}\n\n`;

        message +=
            `الرصيد الحالي: ${account.balance} جنيه\n`;

        message +=
            `إجمالي المدين: ${account.total_debit} جنيه\n`;

        message +=
            `إجمالي الدائن: ${account.total_credit} جنيه\n\n`;

        message += "آخر الحركات:\n";

        if (
            account.transactions &&
            account.transactions.length
        ) {

            account.transactions
                .slice(0, 10)
                .forEach(transaction => {

                    message +=
                        `\n${transaction.transaction_type} - ` +
                        `${transaction.amount} جنيه`;
                });

        } else {

            message += "\nلا توجد حركات";
        }

        alert(message);

    } catch (error) {

        alert("❌ " + error.message);
    }
}


/* دفع للمورد */

async function paySupplier(id) {

    const amount =
        prompt("اكتبي المبلغ المدفوع للمورد:");

    if (amount === null) return;

    const value = Number(amount);

    if (!value || value <= 0) {

        alert("المبلغ غير صحيح");

        return;
    }

    try {

        const response =
            await apiFetch(
                `${API}/suppliers/${id}/payment`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        amount: value
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        alert("✅ تم تسجيل الدفع للمورد");

        loadSuppliers();

    } catch (error) {

        alert("❌ " + error.message);
    }
}


/* تعطيل المورد */

async function deactivateSupplier(id) {

    if (!confirm("هل تريد تعطيل هذا المورد؟")) {
        return;
    }

    try {

        const response =
            await apiFetch(
                `${API}/suppliers/${id}`,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        alert("✅ تم تعطيل المورد");

        loadSuppliers();

    } catch (error) {

        alert("❌ " + error.message);
    }
}


/* حماية النص */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadSuppliers();

</script>

</body>
</html>
